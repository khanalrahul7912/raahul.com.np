  <rect x="35" y="27" width="5" height="4" rx="0.5" fill="rgba(255,255,255,0.5)"/>
  <text x="28" y="47" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" font-weight="700" fill="rgba(255,255,255,0.9)" letter-spacing="0.5">WA</text>
