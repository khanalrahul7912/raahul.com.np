<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <!-- WorldLink Communications — Brand blue: #0060AF -->
  <rect width="60" height="60" rx="12" fill="#0060AF"/>
  <!-- Globe outline -->
  <circle cx="30" cy="27" r="13" fill="none" stroke="#fff" stroke-width="2" opacity="0.95"/>
  <!-- Vertical meridian -->
  <ellipse cx="30" cy="27" rx="6.5" ry="13" fill="none" stroke="#fff" stroke-width="1.4" opacity="0.75"/>
  <!-- Equator -->
  <line x1="17" y1="27" x2="43" y2="27" stroke="#fff" stroke-width="1.4" opacity="0.75"/>
  <!-- Upper parallel -->
  <path d="M19 21 Q30 20 41 21" fill="none" stroke="#fff" stroke-width="1" opacity="0.55"/>
  <!-- Lower parallel -->
  <path d="M19 33 Q30 34 41 33" fill="none" stroke="#fff" stroke-width="1" opacity="0.55"/>
  <!-- Signal arc (connectivity) -->
  <path d="M22 15 Q30 10 38 15" fill="none" stroke="#7EC8E3" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
  <!-- "worldlink" wordmark -->
  <text x="30" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" font-weight="700"
        fill="#fff" letter-spacing="0.5" opacity="0.95">worldlink</text>
</svg>
